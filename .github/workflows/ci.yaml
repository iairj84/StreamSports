name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The version releases are built with on the desktop. Tracking `stable`
  # instead made analysis fail on deprecations introduced in newer releases
  # (Flutter 3.50 deprecates package:flutter/material.dart) that the app does
  # not build against yet. Bump this together with the build machine.
  FLUTTER_VERSION: 3.47.4

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --total-shards 4 --shard-index ${{ matrix.shard }}
